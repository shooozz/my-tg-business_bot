name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        run: |
          pytest -v

      - name: Verify Docker build
        run: |
          docker compose config
          docker compose build --no-cache

  deploy:
    name: Deploy to Production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Archive verified commit
        run: |
          COMMIT_SHA="${{ github.sha }}"
          git archive --format=tar.gz --prefix=market/ HEAD > deploy.tar.gz
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV

      - name: Upload and deploy verified commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            deploy.tar.gz ${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${DEPLOY_USER}@${DEPLOY_HOST} \
            "mkdir -p /opt/market/releases/${COMMIT_SHA} && \
             cd /opt/market/releases/${COMMIT_SHA} && \
             tar xzf /tmp/deploy.tar.gz --strip-components=1 && \
             rm /tmp/deploy.tar.gz && \
             bash deploy/deploy.sh ${COMMIT_SHA}"

      - name: Verify deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${DEPLOY_USER}@${DEPLOY_HOST} \
            "docker compose -p market ps && \
             cat /opt/market/current-release"

      - name: Cleanup SSH keys
        if: always()
        run: rm -f ~/.ssh/deploy_key
